// =====================================================================
//  OpenMoHAA - Nintendo Switch default configuration
//
//  Shipped inside the .nro at romfs:/main/autoexec.cfg and executed at
//  startup. Anything you change in-game is saved to your writable config
//  at sdmc:/switch/openmohaa/main/ and takes precedence on later runs.
//
//  Switch button -> SDL GameController mapping used below:
//    A B X Y            -> PAD0_A / PAD0_B / PAD0_X / PAD0_Y
//    L / R (bumpers)    -> PAD0_LEFTSHOULDER / PAD0_RIGHTSHOULDER
//    ZL / ZR (triggers) -> PAD0_LEFTTRIGGER / PAD0_RIGHTTRIGGER
//    - / +              -> PAD0_BACK / PAD0_START
//    L3 / R3 (stick in) -> PAD0_LEFTSTICK_CLICK / PAD0_RIGHTSTICK_CLICK
//    D-Pad              -> PAD0_DPAD_UP/DOWN/LEFT/RIGHT
// =====================================================================

// ---- Display ----
// 720p is the handheld panel resolution and scales cleanly when docked.
seta r_fullscreen "1"
seta r_mode "-1"
seta r_customwidth "1280"
seta r_customheight "720"
seta r_aspectRatio "1.7777"
// Let the GL backend negotiate the best context (-1). If you see a black
// screen, try forcing it: "1" = OpenGL ES, "0" = desktop/compat GL.
seta r_preferOpenGLES "-1"
seta r_vsync "1"

// ---- Input: no mouse grab on a console, analog gamepad enabled ----
seta in_nograb "1"
seta in_mouse "0"
seta in_joystick "1"
seta in_joystickUseAnalog "1"
seta in_joystickThreshold "0.15"

// Stick -> movement / look axis assignment (SDL axis order:
//   0=LeftX 1=LeftY 2=RightX 3=RightY 4=ZL 5=ZR)
seta j_side_axis     "0"   // left stick X  -> strafe
seta j_forward_axis  "1"   // left stick Y  -> forward/back
seta j_yaw_axis      "2"   // right stick X -> turn
seta j_pitch_axis    "3"   // right stick Y -> look up/down
// NOTE: stick axes are raw -32767..32767, and angles are scaled by
// 0.001*frametime, so look values are small (~0.02) and move values ~0.25.
seta j_side     "0.25"     // strafe (saturates to full at ~40% tilt)
seta j_forward  "-0.25"    // forward/back
seta j_yaw      "-0.009"   // turn speed (stick right = turn right) - lowered
seta j_pitch    "0.009"    // look speed (stick up = look up; flip sign to invert)
seta j_up       "0"

// ---- Gameplay bindings ----
bind PAD0_RIGHTTRIGGER   "+attackprimary"      // ZR - fire
bind PAD0_LEFTTRIGGER    "+attacksecondary"    // ZL - alt fire / iron sights
bind PAD0_RIGHTSHOULDER  "weapnext"            // R  - next weapon
bind PAD0_LEFTSHOULDER   "+speed"              // L  - sprint / walk toggle
bind PAD0_A              "+moveup"             // A  - jump
bind PAD0_B              "+movedown"           // B  - crouch
bind PAD0_X              "+use"                // X  - use / activate
bind PAD0_Y              "reload"              // Y  - reload
bind PAD0_LEFTSTICK_CLICK  "+leanleft"
bind PAD0_RIGHTSTICK_CLICK "+prone"
bind PAD0_DPAD_UP        "weapnext"
bind PAD0_DPAD_DOWN      "weapprev"
bind PAD0_DPAD_LEFT      "+leanleft"
bind PAD0_DPAD_RIGHT     "+leanright"
bind PAD0_START          "togglemenu main"     // + - pause / in-game menu
bind PAD0_BACK           "+scores"             // - - hold for objectives / scoreboard (TAB)
// Dev console moved off "-"; rebind to any spare button if you need it, e.g.:
//   bind PAD0_DPAD_UP "toggleconsole"

// ---- Audio ----
seta s_initsound "1"
seta s_khz "44"

// ---- Misc tuning for the Tegra X1 ----
seta com_maxfps "60"
seta r_picmip "1"
seta cg_shadows "1"

// ---- Logging off for normal play (set developer 1 / logfile 2 to capture a log) ----
seta developer "0"
seta logfile "0"

echo "OpenMoHAA Switch defaults loaded. Right stick aims, ZR fires."
